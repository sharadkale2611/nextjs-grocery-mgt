<svg width="360" height="80" viewBox="0 0 360 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cart Icon -->
  <g transform="translate(0, 8)">
    <!-- Cart Handle -->
    <path d="M4 8 H12 L18 40 H56" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>

    <!-- Cart Body -->
    <rect x="16" y="16" width="40" height="20" rx="4" stroke="#FFFFFF" stroke-width="3"></rect>

    <!-- Inventory Cube -->
    <rect x="30" y="20" width="12" height="12" rx="2" fill="#22C55E"></rect>

    <!-- Wheels -->
    <circle cx="26" cy="44" r="3" fill="#FFFFFF"></circle>
    <circle cx="46" cy="44" r="3" fill="#FFFFFF"></circle>
  </g>

  <!-- Text -->
  <text x="80" y="50" fill="#FFFFFF" font-size="26" font-weight="700" font-family="Inter, Poppins, system-ui, sans-serif">
    Grocery Management
  </text>
</svg>
